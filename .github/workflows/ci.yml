name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Test
        run: pytest

  floor:
    name: Oldest supported pikepdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The oldest Python this project supports, because the oldest
      # pikepdf it supports has no wheels for the newest ones -- pip
      # would try to build it from source and fail on missing qpdf
      # headers.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Read the floor out of pyproject.toml rather than repeating it
      # here. A version written in two places is a version that will
      # disagree with itself.
      - name: Work out the declared floor
        id: floor
        run: |
          version=$(python -c "
          import pathlib, re, tomllib
          deps = tomllib.loads(
              pathlib.Path('pyproject.toml').read_text()
          )['project']['dependencies']
          spec = next(d for d in deps if re.match(r'^pikepdf\b', d))
          floor = re.search(r'>=\s*([0-9][0-9.]*)', spec).group(1)
          parts = floor.split('.')
          print('.'.join(parts + ['0'] * (3 - len(parts))))
          ")
          echo "Declared floor: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install with the floor pinned
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "pikepdf==${{ steps.floor.outputs.version }}"

      # Without this the job is worthless: if the pin silently resolved
      # to something newer, the suite would pass against a version this
      # job claims to have tested and did not.
      - name: Confirm the floor is what got installed
        run: |
          python - <<'PY'
          import os
          import pikepdf

          wanted = os.environ["WANTED"]
          if pikepdf.__version__ != wanted:
              raise SystemExit(
                  f"asked for pikepdf {wanted}, got {pikepdf.__version__}"
              )
          print(f"testing against pikepdf {pikepdf.__version__}")
          PY
        env:
          WANTED: ${{ steps.floor.outputs.version }}

      - name: Test
        run: pytest

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      # Fails below the fail_under threshold in pyproject.toml. Run on a
      # single version: which lines are reachable can differ between
      # interpreters, and a threshold enforced four times is four chances
      # for an unrelated version to block a correct change.
      - name: Test with coverage
        run: pytest --cov

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Ruff check
        run: ruff check pdf-redaction-check.py make-test-samples.py tests/

      - name: Ruff format
        run: ruff format --check pdf-redaction-check.py make-test-samples.py tests/

      # Paths and settings come from [tool.pyright] in pyproject.toml.
      # It resolves imports from whatever interpreter is active, which is
      # the runner's Python here and your .venv locally.
      - name: Pyright
        run: pyright

      # Globs and rule config come from .markdownlint-cli2.jsonc, so this
      # runs exactly what a developer runs locally.
      - name: Markdownlint
        run: npx --yes markdownlint-cli2

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      # The wheel renames the hyphenated script to an importable module.
      # If that mapping ever breaks, the package installs but the command
      # does not run -- so prove it runs, against a real sample.
      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/pdf-redaction-check --help
          /tmp/wheeltest/bin/pdf-redaction-check \
            tests/samples/tagged.pdf --dump-hidden

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
