[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdf-redaction-check"
version = "0.1.0"
description = "Verify that a PDF redaction actually removed the content, instead of just covering it up."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Whalen" }]
keywords = ["pdf", "redaction", "security", "forensics", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]
# This floor is also what the one private name the tool imports needs:
# pikepdf._core.StreamParser, which reads a content stream one object at
# a time rather than building a list of every instruction in it. That
# class, Page.parse_contents and Object._parse_stream have all been
# where they are since pikepdf 8.0.
dependencies = ["pikepdf>=8"]

[project.optional-dependencies]
dev = ["pyright", "pytest", "pytest-cov", "reportlab", "ruff"]

[project.urls]
Source = "https://github.com/seanthegeek/pdf-redaction-check"
Issues = "https://github.com/seanthegeek/pdf-redaction-check/issues"

[project.scripts]
pdf-redaction-check = "pdf_redaction_check:run"

# The source file is hyphenated, which is not a legal Python module name, so it
# is installed under an underscored name that the console script can import.
[tool.hatch.build.targets.wheel]
only-include = []
force-include = { "pdf-redaction-check.py" = "pdf_redaction_check.py" }

[tool.pyright]
include = ["pdf-redaction-check.py", "make-test-samples.py", "tests"]
# Check against the oldest interpreter the project supports, not whatever
# happens to be installed.
pythonVersion = "3.11"
typeCheckingMode = "standard"
# reportlab ships no type information. Its absence is a fact about that
# package, not a defect in this code.
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
# Branch coverage, not just statements: an `if` whose false path is
# never taken is untested even when every line has run.
branch = true
# The tests themselves are not the thing under measurement.
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    # Entry-point guard: exercised by the console script, not by tests.
    'if __name__ == "__main__":',
]
fail_under = 100
show_missing = true

[tool.hatch.build.targets.sdist]
include = [
    "pdf-redaction-check.py",
    "make-test-samples.py",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "docs/",
    "LICENSE",
]
